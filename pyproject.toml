[project]
name = "eduremus-django"
version = "0.1.0"
description = "Multi-Tenant Instituional Management Saas Suite"
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "dj-database-url==3.1.2",
    "django==5.2.16",
    "psycopg2-binary==2.9.12",
    "python-decouple==3.8",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==7.0.0",
    "django-extensions==4.1",
    "django-stubs==6.0.7",
    "ipython==9.16.0",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pytest-django==4.12.0",
    "ruff==0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
unresolved-import = "warn"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]

ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.local"
