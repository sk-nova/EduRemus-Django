# Local development stack for EduRemus-Django.
# Values are interpolated from the project-root .env (see .env.example).

name: eduremus_local

services:
  django:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
      args:
        UV_DEPENDENCY_GROUPS: "--group dev"
    image: eduremus_local_django
    container_name: eduremus_local_django
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The denylist fails closed by design, so a django container that starts
      # before Redis answers would 503 every authenticated request until it
      # did. Gating on the healthcheck makes that window not exist.
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      # Built from the same POSTGRES_* values the db service is created with,
      # so the two can never disagree. This overrides any DATABASE_URL in .env,
      # which is free to point at localhost for host-side manage.py runs.
      DATABASE_URL: postgres://${POSTGRES_USER:-eduremus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-eduremus_db}
      # Hostname the public tenant is registered against on first boot. Tenant
      # subdomains are added with `manage.py tenant_create`.
      PUBLIC_TENANT_DOMAIN: ${PUBLIC_TENANT_DOMAIN:-public.localhost}
      # Reaches the service by name, overriding the .env value that points at
      # localhost for host-side manage.py runs -- the same split as DATABASE_URL.
      REDIS_URL: redis://redis:6379/1
      # Mirrors the production mount point, so the only difference between here
      # and a real deployment is what populates the directory: start.sh
      # generates a development keypair, an agent projects the real ones.
      JWT_KEY_DIRECTORY: /run/secrets/jwt
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-dev-local-a}
    volumes:
      # Source is bind-mounted for autoreload. The virtualenv lives at
      # /opt/venv, so this mount cannot shadow it.
      - .:/app
      # staticfiles volume mount
      - ./staticfiles:/app/staticfiles:rw
      # Uploads are tenant data, namespaced as media/<schema_name>/ by
      # TenantFileSystemStorage. Bind-mounted so they survive a rebuild.
      - ./media:/app/media:rw
      # Development signing keys. A bind mount rather than the tmpfs
      # production uses, so a restart does not invalidate every token you were
      # holding; the directory is git- and docker-ignored, and the keys in it
      # are throwaway. Create it before the first `up`:
      #   mkdir -p secrets/jwt && chmod 700 secrets/jwt
      - ./secrets/jwt:/run/secrets/jwt:rw
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    networks:
      - eduremus_local_network

  redis:
    image: redis:8-alpine
    container_name: eduremus_local_redis
    restart: unless-stopped
    # noeviction is a security setting here, not a memory-tuning one. The
    # default allkeys-lru would evict denylist entries under pressure, which
    # silently reinstates revoked tokens; refusing writes instead makes the
    # failure loud and lets the fail-closed policy take over.
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      # Persisted so revocations survive a restart. The AOF is what makes that
      # true -- with RDB alone, everything denylisted since the last snapshot
      # comes back usable.
      - redis_data:/data
    ports:
      # Loopback-only, like Postgres: reachable from redis-cli on this machine
      # and from nothing on the LAN.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - eduremus_local_network

  db:
    image: postgres:18-trixie
    container_name: eduremus_local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduremus_db}
      POSTGRES_USER: ${POSTGRES_USER:-eduremus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # postgres:18 sets PGDATA to /var/lib/postgresql/18/docker and declares
      # /var/lib/postgresql as its volume — mounting .../data would silently
      # persist nothing.
      - postgres_data:/var/lib/postgresql
    ports:
      # Loopback-only: reachable from GUI clients on this machine, not the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - eduremus_local_network

networks:
  eduremus_local_network:
    driver: bridge

volumes:
  postgres_data: {}
  redis_data: {}
