[project]
name = "eduremus-django"
version = "0.1.0"
description = "Multi-Tenant Instituional Management Saas Suite"
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "dj-database-url==3.1.2",
    "django==5.2.16",
    "django-tenants==3.14.0",
    "psycopg2-binary==2.9.12",
    "python-decouple==3.8",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==7.0.0",
    "django-extensions==4.1",
    "django-stubs==6.0.7",
    "ipython==9.16.0",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pytest-cov==7.0.0",
    "pytest-django==4.12.0",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # --ds, not the DJANGO_SETTINGS_MODULE ini key: pytest-django lets the
    # environment variable win over that key, and the local Docker image
    # exports DJANGO_SETTINGS_MODULE=config.settings.local. `make test` would
    # otherwise run the suite against local settings -- silently, until
    # something (tenant hostnames in ALLOWED_HOSTS) made the two disagree.
    "--ds=config.settings.test",
    # Recreate the test database only when asked (make test-fresh).
    "--reuse-db",
]

[tool.coverage.run]
branch = true
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py314"
# Django generates migrations; they are not ours to style. force-exclude makes
# this stick when pre-commit passes filenames explicitly.
extend-exclude = ["*/migrations/*"]
force-exclude = true

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
unresolved-import = "warn"

[tool.mypy]
python_version = "3.14"
# django_tenants.mypy_plugin declares the ``request.tenant`` attribute that
# TenantMainMiddleware attaches at runtime; without it every use is an error.
plugins = ["mypy_django_plugin.main", "django_tenants.mypy_plugin"]

ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.local"
